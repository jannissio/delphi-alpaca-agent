# ---------------------------------------------------------------------------
# STRATEGY PARAMETERS - evidence in research/STATE_OF_THE_ART.md section 8.1,
# revised 2026-09-02 with research/F1_user_sources_options.md (Vilkov 2026;
# Dim/Eraker/Vilkov 2025; Fu/Li/Musto SEC; Carr/Wu 2009) and F2 (Koviazin et al.).
# Times in America/New_York. The LLM cannot write this file.
# ---------------------------------------------------------------------------
underlyings:
  SPY:
    enabled: true
    role: primary
    strike_increment: 1.0
  QQQ:
    enabled: false                 # F1: SPX VRP survives at bid prices (t=-7.44), QQQ does not (t=-1.39). SPY only.
    role: secondary
    strike_increment: 1.0

structure:
  family: IRON_CONDOR_0DTE
  dte: 0
  # Strike anchor: implied remaining-day move from the ATM straddle (computed by code).
  # F1 E-V11: the put side was the richer 0DTE sale 2016-2026, contradicting the call tilt -> symmetric.
  short_mult: 1.10                 # fixed rule: both shorts at 1.10x the implied move. With conformal.enabled
                                   # this rule is only the logged counterfactual (research/G, section 4.5).
  # F1 E-V7/E-V8: condor Sharpe rises monotonically with short distance; wings of 0.15-0.3 % of spot are untested.
  wing_width_pct_of_spot: 0.005    # wing = max(min_wing_usd, pct * spot), rounded to the strike increment
  min_wing_usd: 3.0
  min_credit_pct_of_wing: 0.15     # reject if package credit < 15 % of wing (F1 suggested 25 %, but its best geometry, +-1 % shorts with 1 % wings, has a lower ratio; spread cost is gated separately)
  max_abs_net_delta_per_package: 0.05
  short_delta_min: 0.03            # cross-check only: short strikes must sit in this |delta| band
  short_delta_max: 0.25
  take_profit_pct_of_credit: 0.50  # optional variance reduction; 0 disables

sizing:
  positions_per_session_max: 3
  contracts_per_position_max: 6    # F1 E-V4/E-F12: cap 6, slice into orders of <= 5 (risk_limits caps orders at 5)
  first_live_order_contracts: 0    # deploy_paper_first pilot: 1 = first order of the campaign is 1 lot; 0 = off. Pilot ran on 2026-09-02; full size from 2026-09-03
  half_size_if_vix1d_top_tercile: true   # F1 E-V12: condor mean by implied-variance tercile +0.0016/+0.0005/-0.0111 (t=-0.93)
  vix1d_tercile_lookback_sessions: 60

regime:
  vix_vix3m_full: 0.95             # ratio < 0.95: full budget (Johnson 2017 term-structure slope)
  vix_vix3m_half: 1.00             # 0.95-1.00: half budget; >= 1.00: no new risk
  iv_rv_min_ratio: 1.0             # veto if diffusive 0DTE implied vol < realised intraday vol (D-R15; F2: strip the event variance first)
  source: cboe_delayed_json        # cdn.cboe.com delayed quotes; a 15-min delay is fine for a regime gate
  llm_votes: 3                     # F2 5.2: unanimity across k calls on family and veto; disagreement -> NO_TRADE
  llm_cache_s: 600

entry_windows_et:
  "2026-09-02": [["10:00", "11:00"], ["12:30", "13:30"]]   # Wed; pause 13:55-14:15 (Beige Book) is in calendar.yaml
  "2026-09-03": [["10:15", "11:00"], ["12:30", "13:30"]]   # Thu after ISM services 10:00 and the Broadcom gap
  "2026-09-04": []                                          # Fri: NO_TRADE (NFP 08:30 ET), logged decision
no_new_entry_after_et: "14:00"     # F1 E-V19: last hour is where realised skew dominates

# Conformal Risk Control Condor (docs/THEORY.md; research/G_conformal_condor.md; agent/core/conformal.py).
# Enabled 2026-09-03. Short strikes = radius at which the *expected payout to the buyer* is certified to be
# at most beta of the wing (conformal risk control, Angelopoulos et al. ICLR 2024; online step = Rolling RC,
# Feldman et al. TMLR 2023). Gate 31 trades only when the market pays more than the certified payout plus a
# margin: credit/wing - beta_cert >= margin, which implies E[payoff] >= margin x wing under exchangeability.
# The coverage track (alpha, ACI) is kept as the logged counterfactual. All numbers below were fixed before
# the first live session under this rule; none is tuned on live data.
conformal:
  enabled: true
  rule: crc                        # crc = risk track sets strikes and gate; coverage = the research/G variant
  beta_target: 0.10                # expected payout to the buyer <= 10 % of the wing
  beta_lo: 0.02
  beta_hi: 0.30
  alpha_target: 0.20               # coverage track: 80 % interval (counterfactual)
  gamma: 0.005                     # online step for both tracks; fixed, not fitted
  window: 250                      # trailing calibration scores (about one year of sessions)
  k_min: 0.35                      # tradability clip on the radius, in implied-move units; logged when it binds
  k_max: 1.60
  margin: 0.05                     # 5 % of the wing ~ $20/contract at a $4 wing ~ four legs round trip at one tick
  credit_reference: natural        # gate 31 reads credit/wing at the expected fill (the natural: paper fills only marketable orders); the mid is logged alongside. Was mid until 2026-09-02
  wing_pct_of_spot: 0.005          # omega = wing / implied move uses the strategy wing; this is the fallback
  horizon: ratio_1030              # history column: 10:30 ET anchor to the close (scripts/history_data.py)
  min_scores: 50

execution:
  order_type: limit                # never market
  package_only: true               # mleg only, all legs covered in the same order
  # F1 E-F5..F13 (Fu/Li/Musto): work in ticks on the package. SPY options: $0.01 tick below $3, $0.05 above.
  max_leg_spread_ticks: 5          # per-leg backstop. Was 3 until 2026-09-02 (F1 E-F5); the pilot showed the 3-tick short-leg
                                   # check rejecting feed artefacts on most 10:00-11:00 evaluations while the package round-trip
                                   # gate (risk_limits max_roundtrip_cost_pct_of_credit) is the actual cost control. See docs/CONFIG_CHANGES.md.
  max_wing_spread_ticks: 5         # bought wings are deep OTM and cheap; up to 5 ticks, else try a neighbouring width
  walk_ticks: [1]                  # rungs from the fresh mid toward the natural (credit side). Was [0, 1, 2] until 2026-09-02 (docs/CONFIG_CHANGES.md)
  final_rung_natural: true         # Alpaca PAPER only fills marketable orders; the last rungs are the (re-quoted) natural. Fill rung is a reported process metric.
  natural_rung_repeats: 2          # the natural is re-quoted and re-sent this many times (pilot: only a rung at or through the live natural fills)
  requote_each_rung: true          # re-derive every rung from fresh quotes at send time (pilot 2026-09-02: a ladder fixed at the decision chased a decaying credit)
  walk_step_interval_s: 20         # 3 rungs x 20 s: the ladder reaches the live natural inside 60 s. Was 30 s until 2026-09-02
  cancel_after_s: 150
  paper_fill_model: nbbo_when_marketable

long_gamma_sleeve:
  enabled: false                   # demo only, <= 0.3 % of capital; consider enabling Thursday if all is stable
  max_cost_pct: 0.003
  dte_min: 2
  dte_max: 7
